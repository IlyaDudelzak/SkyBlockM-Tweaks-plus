pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'KikuGie'
            url = 'https://maven.kikugie.dev/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.9.8"
}

stonecutter {
    create(rootProject) {
        versions "1.20.1", "1.20.4", "1.21.1", "1.21.3", "1.21.8", "1.21.11"
    }
}

rootProject.name = "SkyBlockM-Tweaks-plus"
