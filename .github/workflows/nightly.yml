name: Nightly Release

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract mod version
        id: mod_version
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted mod version: $VERSION"

      - name: Build all versions with Stonecutter
        run: ./gradlew build -x test

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || 'nightly' }}
          name: ${{ format('Nightly Build v{0} (Latest dev)', steps.mod_version.outputs.version) }}
          prerelease: true
          make_latest: false
          files: versions/*/build/libs/skyblockm-tweaks-plus-*.jar
          body: |
            ### 🧪 SkyBlockM Tweaks+ Nightly Build
            Автоматическая тестовая сборка из ветки `dev`.

            - **Версия мода**: `v${{ steps.mod_version.outputs.version }}`
            - **Коммит**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Ветка**: `${{ github.ref_name }}`
            - **Дата сборки**: ${{ github.event.head_commit.timestamp || github.run_id }}

            > ⚠️ **Внимание**: Это экспериментальная сборка для тестирования новых возможностей и исправлений.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
