name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty for v<version>)'
        required: false
        default: ''
      build_number:
        description: 'Custom build number (optional, defaults to git commit count)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as pre-release / beta'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine build number and version
        id: build_info
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUM="${{ inputs.build_number }}"
          else
            BUILD_NUM=$(git rev-list --count HEAD)
          fi
          FULL_VERSION="${VERSION}+build.${BUILD_NUM}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD_NUM"
          echo "Full version: $FULL_VERSION"

      - name: Build all versions with Stonecutter
        run: ./gradlew build -x test -Pbuild_number=${{ steps.build_info.outputs.build_number }}
        env:
          BUILD_NUMBER: ${{ steps.build_info.outputs.build_number }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.build_info.outputs.version)) }}
          name: ${{ format('SkyBlockM Tweaks+ v{0} (build {1})', steps.build_info.outputs.version, steps.build_info.outputs.build_number) }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || contains(inputs.tag_name, 'beta') || contains(inputs.tag_name, 'alpha') || inputs.is_prerelease == true }}
          files: versions/*/build/libs/skyblockm-tweaks-plus-*.jar
          generate_release_notes: true
          body: |
            - **Версия мода**: `v${{ steps.build_info.outputs.full_version }}`
            - **Номер сборки**: `${{ steps.build_info.outputs.build_number }}`
            - **Коммит**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
