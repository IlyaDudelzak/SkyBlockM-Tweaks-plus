plugins {
	id "fabric-loom" version "${loom_version}"
}

group = project.mod_group
version = project.mod_version

repositories {
	mavenCentral()
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    if (file("src/main/resources/skyblockm-tweaks.accesswidener").exists()) {
        accessWidenerPath = file("src/main/resources/skyblockm-tweaks.accesswidener")
    } else {
        accessWidenerPath = rootProject.file("src/main/resources/skyblockm-tweaks.accesswidener")
    }
	runs {
		client {
			programArgs "--username", "tester2"
			property "fabric.log.level", "debug"
			property "log4j2.level", "debug"
			property "mixin.debug.verbose", "true"
			property "mixin.debug.export", "true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

	implementation "com.microsoft.onnxruntime:onnxruntime:1.20.0"
}

remapJar {
    archiveBaseName = "${archive_name}-${mod_version}+mc${minecraft_version}"
    archiveVersion = ""
}

processResources {
	filesMatching("fabric.mod.json") {
		expand "version": project.version
		filter { String line ->
			if (line.contains('"minecraft": "*"') && project.hasProperty("minecraft_dependency")) {
				return line.replace('"minecraft": "*"', '"minecraft": ' + project.minecraft_dependency)
			}
			return line
		}
	}
}

int targetJava = project.minecraft_version.startsWith("1.20") ? 17 : 21

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJava
}

java {
	sourceCompatibility = JavaVersion.toVersion(targetJava)
	targetCompatibility = JavaVersion.toVersion(targetJava)
}

if (project == rootProject) {
    tasks.register("chiseledBuild") {
        group = "build"
        description = "Builds all Minecraft versions configured in Stonecutter."
        dependsOn subprojects.collect { it.tasks.named("build") }
    }
}
